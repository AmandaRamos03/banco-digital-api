spring:
  application:
    name: banco-digital-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bancodigital}
    username: ${DB_USER:banco}
    password: ${DB_PASSWORD:banco}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-1234567890}
    expiracao-minutos: 120

springdoc:
  swagger-ui:
    path: /swagger-ui.html
