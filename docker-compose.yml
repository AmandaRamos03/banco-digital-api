services:
  postgres:
    image: postgres:16
    container_name: bancodigital-db
    environment:
      POSTGRES_DB: bancodigital
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    ports:
      - "5432:5432"
    volumes:
      - bancodigital-data:/var/lib/postgresql/data

volumes:
  bancodigital-data:
